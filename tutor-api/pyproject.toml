[project]
name = "kwtutor"
version = "0.3.0"
description = "輔導刷卡系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioodbc==0.5.0",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "apscheduler==3.10.4",
    "certifi==2024.8.30",
    "cffi==1.17.1",
    "charset-normalizer==3.4.0",
    "click==8.1.7",
    "colorama==0.4.6",
    "cryptography==44.0.3",
    "dnspython==2.7.0",
    "email-validator==2.2.0",
    "exceptiongroup==1.3.0",
    "fastapi==0.115.4",
    "fastapi-cli==0.0.5",
    "filetype==1.2.0",
    "greenlet==3.1.1",
    "gunicorn>=23.0.0 ; sys_platform == 'linux'",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "httptools==0.6.4",
    "httpx==0.27.2",
    "idna==3.10",
    "iniconfig==2.0.0",
    "jinja2==3.1.6",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "nh3>=0.2.21",
    "orjson==3.10.18",
    "packaging==24.2",
    "pillow==11.2.1",
    "pluggy==1.5.0",
    "pycparser==2.22",
    "pydantic==2.9.2",
    "pydantic-core==2.23.4",
    "pydantic-settings==2.9.1",
    "pygments==2.18.0",
    "pyodbc==5.2.0",
    "pyspnego==0.11.2",
    "pytest==8.3.3",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.18",
    "pytz==2024.2",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "rich==13.9.4",
    "shellingham==1.5.4",
    "six==1.16.0",
    "smbprotocol==1.15.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.36",
    "sspilib==0.3.1",
    "starlette==0.41.2",
    "tomli==2.2.1",
    "typer==0.13.0",
    "typing-extensions==4.12.2",
    "typing-inspection==0.4.0",
    "tzdata==2024.2",
    "tzlocal==5.2",
    "urllib3==2.2.3",
    "uvicorn==0.32.0",
    "watchfiles==0.24.0",
    "websockets==14.1",
]
[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
extend-exclude = [".venv", ".vscode", "__pycache__",  "**/uv/python/**"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D103", "D101", "TD003", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10
max-locals = 15
max-returns = 10
max-statements = 100
max-branches = 12
max-public-methods = 20
max-nested-blocks = 5
max-positional-args = 6
