services:
  :
    image: 
    build:
      context: .
      dockerfile: ./Dockerfile
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 -m uvicorn src.main:app --host 0.0.0.0 --port 8001"]
    ports:
      - 8001:8001
      - 5678:5678
    environment:
      - DEBUG=True