name: Staging Server Deployment

on:
  pull_request:
    branches: [ main ]

jobs:
  check-code:
    runs-on: staging-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
            args: "check --output-format=github ."

  deploy:
    runs-on: staging-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Configuration
        run: |
          if [ ! -f "src/config.py" ]; then
            cp src/config.py.example src/config.py
          fi

      - name: Install Dependencies with uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          /var/lib/act_runner/.local/bin/uv sync

      - name: Deploy Systemd Service
        # Mapping secrets to local env variables for the shell session
        env:
          DB_HOST: ${{ secrets.TEST_DB_HOST }}
          DB_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          DB_NAME: ${{ secrets.TEST_DB_NAME }}
        run: |
          VERSION=$(python3 get_version.py)
          SERVICE_NAME="kwtutor"
          PORT="8001"
          
          echo "[*]  v$VERSION starting deployment..."
          chmod o+x "$(pwd)"
          
          # We use the env variables set above to build the file content
          printf "[Unit]
          Description=$SERVICE_NAME
          After=network.target
          
          [Service]
          User=act_runner
          WorkingDirectory=$(pwd)
          ExecStart=$(pwd)/.venv/bin/fastapi run src/main.py --port $PORT 
          Restart=always
          Environment=PYTHONUNBUFFERED=1
          Environment=TZ=Asia/Taipei
          Environment=\"DB_HOST=$DB_HOST\"
          Environment=\"DB_USERNAME=$DB_USERNAME\"
          Environment=\"DB_PASSWORD=$DB_PASSWORD\"
          Environment=\"DB_NAME=$DB_NAME\"
          
          [Install]
          WantedBy=multi-user.target" | sudo /usr/bin/tee /etc/systemd/system/$SERVICE_NAME.service > /dev/null

      - name: Restart Service
        run: |
          SERVICE_NAME="kwtutor"
          sudo /usr/bin/systemctl daemon-reload
          sudo /usr/bin/systemctl enable "$SERVICE_NAME"
          sudo /usr/bin/systemctl restart "$SERVICE_NAME"
          
          if /usr/bin/systemctl is-active --quiet "$SERVICE_NAME"; then
              echo "[✓] $SERVICE_NAME is running."
          else
              echo "[x] $SERVICE_NAME failed to start."
              sudo /usr/bin/systemctl status "$SERVICE_NAME" --no-pager
              exit 1
          fi