[project]
name = "touch"
version = "2025.7.2"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "aioodbc==0.5.0",
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "apscheduler==3.11.0",
    "certifi==2024.8.30",
    "cffi==1.17.1",
    "click==8.1.7",
    "colorama==0.4.6",
    "cryptography==44.0.0",
    "dnspython==2.7.0",
    "email-validator==2.2.0",
    "exceptiongroup==1.2.2",
    "fastapi==0.115.5",
    "fastapi-cli==0.0.5",
    "greenlet==3.1.1",
    "gunicorn>=23.0.0 ; sys_platform == 'linux'",
    "h11==0.14.0",
    "httpcore==1.0.7",
    "httptools==0.6.4",
    "httpx==0.28.0",
    "idna==3.10",
    "jinja2==3.1.4",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "pycparser==2.22",
    "pydantic==2.10.2",
    "pydantic-core==2.27.1",
    "pydantic-settings==2.7.1",
    "pygments==2.18.0",
    "pyodbc==5.2.0",
    "pyspnego==0.11.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.19",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "shellingham==1.5.4",
    "smbprotocol==1.15.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.36",
    "sspilib==0.2.0",
    "starlette==0.41.3",
    "typer==0.14.0",
    "typing-extensions==4.12.2",
    "tzdata==2024.2",
    "tzlocal==5.2",
    "uvicorn==0.32.1",
    "watchfiles==1.0.0",
    "websockets==14.1",
