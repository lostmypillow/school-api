services:
  db:
    container_name: school-db-dev
    image: mcr.microsoft.com/azure-sql-edge:latest
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqledge_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 2048M
          cpus: '1.0'
    networks:
      - nginx-schoolapi-dev-net
      - schoolapp-internal-dev-net
    healthcheck:
      test: [ "CMD", "/bin/bash", "-c", "</dev/tcp/127.0.0.1/1433" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    container_name: school-redis-dev
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=Asia/Taipei
    networks:
      - schoolapp-internal-dev-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy


  api:
    container_name: school-fastapi-dev
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - schoolapp-internal-dev-net
    env_file:
      - .env
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started


  worker:
    container_name: school-worker-dev
    build: .
    command: ["python", "-m", "app.worker"]
    restart: always
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    volumes:
      - /var/lib/school-api/data:/app/data
    env_file:
      - .env
    networks:
      - schoolapp-internal-dev-net
      - schoolapp-worker-dev-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1


volumes:
  mssql_data:

networks:
  schoolapp-worker-dev-net:
    driver: bridge
    name: schoolapp-worker-dev-net
  schoolapp-internal-dev-net:
    driver: bridge
    name: schoolapp-internal-dev-net
    internal: true
