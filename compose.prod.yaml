services:
  db:
    container_name: school-db-prod
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 2048M
          cpus: '1.0'
    networks:
      - schoolapp-internal-prod-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P 'YourPassword123!' -Q 'SELECT 1' -C
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    container_name: school-redis-prod
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=Asia/Taipei
    networks:
      - schoolapp-internal-prod-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy


  api:
    container_name: school-fastapi-prod
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - schoolapp-internal-prod-net
    env_file:
      - .env
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started


  worker:
    container_name: school-worker-local
    build: .
    command: ["python", "-m", "app.worker"]
    restart: always
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    env_file:
      - .env
    networks:
      - schoolapp-internal-prod-net
      - schoolapp-worker-prod-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1


volumes:
  mssql_data:

networks:
  schoolapp-worker-prod-net:
    driver: bridge
    name: schoolapp-worker-net
  schoolapp-internal-prod-net:
    driver: bridge
    name: schoolapp-internal-prod-net
    internal: true
