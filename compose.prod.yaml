services:
  db:
    container_name: school-db-prod
    image: postgres:18.6-trixie
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourPassword123!
      - POSTGRES_DB=student_db
      - TZ=Asia/Taipei
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - school-db-net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    container_name: school-redis-prod
    image: redis:8.4.7-trixie
    restart: always
    environment:
      - TZ=Asia/Taipei
    networks:
      - school-db-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy


  api:
    container_name: school-fastapi-prod
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - proxy-school-net
      - school-db-net
      - school-worker-net
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    env_file:
      - .env.prod
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started


  worker:
    container_name: school-worker-prod
    build: .
    command: ["python", "-m", "app.worker"]
    restart: always
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    env_file:
      - .env.prod
    networks:
      - school-worker-net
      - school-db-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1


volumes:
  postgres_data:

networks:
  proxy-school-net:
    driver: bridge
    name: proxy-school-net

  school-db-net:
    driver: bridge
    name: school-db-net
    internal: true
  school-worker-net:
    driver: bridge
    name: school-worker-net
    internal: true

