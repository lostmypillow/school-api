name: CI & Production Deploy (Main)

on:
  push:
    branches: [ main, master ]


jobs:
  deploy-prod:
    name: Deploy prod Stack
    runs-on: host
    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false

      - name: Restore LFS Cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}

      - name: Pull LFS files
        run: |
          git remote set-url origin https://${{ secrets.GITHUB_TOKEN }}@git.lostmypillow.com/lostmypillow/school-api.git
          git lfs pull

      - name: Build & Deploy prod Containers
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          echo "Deploying updated Docker containers to prod environment..."
          docker compose -f compose.prod.yaml down
          docker compose -f compose.prod.yaml up -d --build
          docker inspect -f '{{json .NetworkSettings.Networks}}' nginx-proxy-manager | grep -q '"proxy-school-net"' || \
          docker network connect proxy-school-net nginx-proxy-manager
