name: CI & Production Deploy (Main)

on:
  push:
    branches: [ main, master ]


jobs:
  deploy-prod:
    name: Deploy prod Stack
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.lfsconfig', '.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Build & Deploy prod Containers
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          echo "Deploying updated Docker containers to prod environment..."
          docker compose -f compose.prod.yaml down
          docker compose -f compose.prod.yaml up -d --build
          docker network connect nginx-schoolapi-prod-net nginx-proxy-manager
