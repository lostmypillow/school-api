name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "latest"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --no-default-groups --group dev

      - name: Run Linter (Ruff)
        run: uv run ruff check

      - name: Run Type checker (pyrefly)
        run: uv run pyrefly check app/domains/courses app/domains/tutor




      - name: Fix SQL files and lint (sqlfluff)
        run: uv run sqlfluff lint app/core/sql --dialect=postgres

  deploy-dev:
    name: Deploy dev Stack
    needs: test
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy dev Containers
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          echo "Deploying updated Docker containers to dev environment..."
          docker compose -f compose.dev.yaml down
          docker compose -f compose.dev.yaml up -d --build

  integration_test:
    name: Integration test
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "latest"
          enable-cache: true


      - name: Install Dependencies
        run: uv sync --no-default-groups --group dev

      - name: Run Tests (pytest)
        run: uv run pytest