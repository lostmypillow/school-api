name: CI & Staging Deploy (PR)

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: https://github.com/astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --no-default-groups --group dev

      - name: Run Linter (Ruff)
        run: uv run ruff check

      - name: Run Type checker (pyrefly)
        run: uv run pyrefly check app/domains/courses app/domains/sync


  deploy-dev:
    name: Deploy dev Stack
    needs: test
    runs-on: host
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Deploy dev Containers
        run: |
          echo "Deploying updated Docker containers to dev environment..."
          docker compose -f compose.dev.yaml down student-system-api-dev student-system-worker-dev
          docker compose -f compose.dev.yaml up -d --build
