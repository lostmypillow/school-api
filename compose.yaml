services:
  db:
    container_name: school-db-local
    image: postgres:latest
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourPassword123!
      - POSTGRES_DB=student_db 
      - TZ=Asia/Taipei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nginx-schoolapi-local-net
      - schoolapp-internal-local-net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    container_name: school-redis-local
    image: redis:7-alpine
    restart: always
    environment:
      - TZ=Asia/Taipei
    networks:
      - schoolapp-internal-local-net
      - nginx-schoolapi-local-net
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy


  api:
    container_name: school-fastapi-local
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - schoolapp-internal-local-net
      - nginx-schoolapi-local-net
    ports:
      - "8080:8000"
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    env_file:
      - .env
    depends_on:
      worker:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started


  worker:
    container_name: school-worker-local
    build: .
    command: ["python", "-m", "app.worker"]
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONWARNINGS=ignore:resource_tracker:UserWarning
      - TZ=Asia/Taipei
    env_file:
      - .env
    networks:
      - schoolapp-internal-local-net
      - nginx-schoolapi-local-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1


volumes:
  postgres_data:

networks:
  nginx-schoolapi-local-net:
    driver: bridge
    name: nginx-schoolapi-local-net

  schoolapp-internal-local-net:
    driver: bridge
    name: schoolapp-internal-local-net
    internal: true
