[project]
name = "search-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
     "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "mangum>=0.21.0",
    "aws-cdk-lib>=2.261.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
    "aws-cdk-aws-lambda-python-alpha>=2.265.0a0",
    "gunicorn>=26.2.0",
]

[tool.pyrefly]
search-path = ["."]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
   
]
[tool.fastapi]
entrypoint = "src.app:app"

