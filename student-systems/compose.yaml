services:
  student-system-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env


  student-system-worker:
    build: .
    command: ["python", "-m", "arq", "app.workers.settings.WorkerSettings" ]
    restart: always
    env_file:
      - .env

