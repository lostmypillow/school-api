[project]
name = "school-api"
version = "4.0.1"
description = "API to search NTUT courses and movies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]==0.142.4",
    "httpx>=0.28.1",
    "lxml==6.1.3",
    "pydantic>=2.13.4",
    "python-dotenv==1.2.4",
    "gunicorn>=26.2.0; sys_platform != 'win32'",
    "sqlalchemy>=2.0.52",
    "aiosqlite>=0.22.1",
    "fastapi-redis-sdk==0.8.1",
    "greenlet>=3.5.5",
    "rq>=2.0.0",
    "tqdm==4.70.1",
    "types-tqdm>=4.70.0.20260906",
    "pyodbc>=5.3.0",
    "aioodbc>=0.5.0",
    "cachetools>=5.2.0",
    "asyncache>=0.3.1",
    "pyarrow>=25.0.1",
    "mssql-python>=1.15.0",
    "apscheduler>=3.11.3",
    "smbprotocol>=1.17.0",
]


[dependency-groups]
dev = [
    "nh3>=0.3.7",
    "pyrefly>=1.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
[tool.ruff]
exclude = [".venv", "app/domains/internal", "app/domains/media", "app/domains/sms", "app/domains/touch", "app/domains/tutor", "app/domains/vm", "app/core/legacy"]

[tool.pyrefly]
preset = "default"
search-path = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a live MSSQL instance",
]

[tool.ruff.lint]
select = ["E", "F", "ASYNC"]
ignore = ["N999", "E501"]

[tool.fastapi]
entrypoint = "app.main:app"
