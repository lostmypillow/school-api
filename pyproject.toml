[project]
name = "school-api"
version = "4.0.1"
description = "API to search NTUT courses and movies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]==0.150.0",
    "httpx>=0.28.1",
    "lxml==6.1.3",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "gunicorn>=26.2.0; sys_platform != 'win32'",
    "sqlalchemy==2.1.5",
    "aiosqlite>=0.22.1",
    "fastapi-redis-sdk==0.8.1",
    "greenlet==3.5.6",
    "rq>=2.0.0",
    "tqdm==4.70.1",
    "types-tqdm>=4.70.0.20260906",
    "pyodbc>=5.3.0",
    "aioodbc>=0.5.0",
    "cachetools>=5.2.0",
    "asyncache>=0.3.1",
    "pyarrow==26.0.0",
    "apscheduler>=3.11.3",
    "smbprotocol>=1.17.0",
    "proxmoxer>=2.3.0",
    "requests-async>=0.2.4",
    "chardet>=7.6.0",
    "pymupdf>=1.28.2",
    "aiofiles>=25.1.0",
    "sqlfluff>=4.4.0",
    "anyio==4.15.1",
    "orjson>=3.13.0",
    "polars>=2.0.0",
    "nh3>=0.3.7",
    "asyncpg>=0.32.0",
    "redis>=8.1.0",
    "adbc-driver-postgresql>=1.12.0",
]


[dependency-groups]
dev = [
    "ansible>=14.5.0",
    "ansible-dev-tools>=26.1.0",
    "molecule>=26.10.0",
    "molecule-plugins[podman]>=26.10.12",
    "pyrefly>=1.2.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
[tool.ruff]
exclude = [".venv"]

[tool.pyrefly]
preset = "default"
search-path = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring a live DB instance",
]

[tool.ruff.lint]
select = ["E", "F", "ASYNC"]
ignore = ["N999", "E501"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.sqlfluff.core]
dialect = "tsql"
templater = "placeholder"

[tool.sqlfluff.templater.placeholder]
param_style = "question_mark"

